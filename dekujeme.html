<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Děkujeme za poptávku | sulc3d.cz</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#080c14" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #080c14;
      color: #e8eaf0;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 5%;
      text-align: center;
    }
    .box {
      max-width: 560px;
      background: #141c2e;
      border: 1px solid rgba(79,123,239,0.2);
      border-radius: 24px;
      padding: 3.5rem 2rem;
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 900; letter-spacing: -1px; margin-bottom: 1rem; }
    p { color: #7a869a; margin-bottom: 2rem; }
    a.btn {
      display: inline-block;
      padding: 0.9rem 2.2rem;
      background: linear-gradient(135deg, #4f7bef, #8b5cf6);
      color: #fff;
      font-weight: 700;
      border-radius: 50px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="box">
    <div class="icon">✅</div>
    <h1>Děkujeme za poptávku!</h1>
    <p>Vaši zprávu jsme přijali. Do 24 hodin se vám ozveme s cenovou nabídkou na e-mail, který jste uvedli.</p>
    <a href="/" class="btn">Zpět na hlavní stránku</a>
  </main>

</html>
